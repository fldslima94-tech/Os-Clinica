<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Golden Metallic Gradients -->
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DD9B" />
      <stop offset="30%" stop-color="#D6A846" />
      <stop offset="60%" stop-color="#F7E6B8" />
      <stop offset="85%" stop-color="#B2862B" />
      <stop offset="100%" stop-color="#7A5612" />
    </linearGradient>

    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBF9F5" />
    </linearGradient>

    <filter id="iconGleam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4E3509" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean rounded squircle container -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" stroke="#EAE3D5" stroke-width="4" />

  <!-- Central Gold Lotus & Female Profile Motif -->
  <g transform="translate(256, 252)" filter="url(#iconGleam)" fill="none" stroke="url(#iconGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Lotus Petal -->
    <path d="M 0 -150 C 18 -118 20 -82 0 -48 C -20 -82 -18 -118 0 -150 Z" stroke-width="9" fill="url(#iconBg)" fill-opacity="0.3" />
    
    <!-- Left Inner Petal -->
    <path d="M 0 -48 C -18 -82 -42 -122 -15 -136 C 2 -142 5 -105 0 -48" stroke-width="9" />
    
    <!-- Right Inner Petal -->
    <path d="M 0 -48 C 18 -82 42 -122 15 -136 C -2 -142 -5 -105 0 -48" stroke-width="9" />

    <!-- Left Flanking Lotus Petal -->
    <path d="M -8 -45 C -45 -65 -80 -78 -64 -102 C -48 -124 -24 -92 -3 -56" stroke-width="8.5" />

    <!-- Right Flanking Lotus Petal -->
    <path d="M 8 -45 C 45 -65 80 -78 64 -102 C 48 -124 24 -92 3 -56" stroke-width="8.5" />

    <!-- Lotus Calyx / Base Support Arc -->
    <path d="M -38 -44 C -12 -34 12 -34 38 -44" stroke-width="7.5" />

    <!-- Female Profile Silhouette (Facing Right) -->
    <path d="
      M -2 -34
      C 18 -15 28 8 28 28
      C 28 36 29 42 37 49
      C 43 54 44 58 35 63
      C 29 67 31 71 37 74
      C 42 77 40 82 32 86
      C 27 89 28 94 34 100
      C 37 104 33 112 25 116
      C 14 121 -2 123 -14 135
      C -22 144 -26 156 -24 168
    " stroke-width="10" />

    <!-- Flowing Hair & Left Encompassing Contour -->
    <path d="
      M -36 -44
      C -65 -20 -95 10 -105 45
      C -118 90 -95 140 -50 162
      C -18 178 12 165 24 148
      C 32 136 28 122 18 116
    " stroke-width="10" />

    <!-- Inner Arm/Neck Accent Gesture -->
    <path d="
      M -42 160
      C -68 140 -82 95 -68 55
      C -58 24 -35 -5 -12 -28
    " stroke-width="8" />

    <path d="
      M -48 152
      C -25 130 -8 92 8 48
      C 12 36 10 20 2 8
    " stroke-width="8.5" />
  </g>
</svg>
